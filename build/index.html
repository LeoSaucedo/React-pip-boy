  <body>
    <div class="overlay"></div>
    <div id="app"></div>
    <script src="bundle.js"></script>
    <script>
      // Enhanced PWA functionality for Android
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("./sw.js")
            .then(function (registration) {
              console.log("SW registered: ", registration);

              // Update available
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    // New update available
                    if (confirm("New version available! Reload to update?")) {
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch(function (registrationError) {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }

      // Android PWA install prompt
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        console.log("PWA install prompt available");
        e.preventDefault();
        deferredPrompt = e;

        // Show custom install button (optional)
        // You could add a custom "Install App" button here
      });

      // Handle app installation
      window.addEventListener("appinstalled", (evt) => {
        console.log("PWA was installed");
        deferredPrompt = null;
      });

      // Android fullscreen on launch
      if (window.matchMedia("(display-mode: standalone)").matches) {
        console.log("Running as PWA");
        // Hide any web-specific UI elements
        document.body.classList.add("pwa-mode");
      }

      // Screen orientation handling for Android
      if ("screen" in window && "orientation" in window.screen) {
        const handleOrientationChange = () => {
          // Force landscape for better Pip-Boy experience
          if (
            window.screen.orientation.angle !== 90 &&
            window.screen.orientation.angle !== 270
          ) {
            // Suggest landscape mode
            console.log("Landscape mode recommended for best experience");
          }
        };

        window.screen.orientation.addEventListener(
          "change",
          handleOrientationChange
        );
        handleOrientationChange(); // Check initial orientation
      }

      // Android back button handling
      if ("navigation" in window && "NavigationDestination" in window) {
        // Handle Android back button in PWA
        window.addEventListener("popstate", (event) => {
          // Custom back button handling if needed
        });
      }

      // Wake lock for Android (keep screen on during use)
      let wakeLock = null;
      const requestWakeLock = async () => {
        if ("wakeLock" in navigator) {
          try {
            wakeLock = await navigator.wakeLock.request("screen");
            console.log("Screen wake lock acquired");
          } catch (err) {
            console.log("Wake lock failed:", err);
          }
        }
      };

      // Request wake lock when app becomes visible
      document.addEventListener("visibilitychange", async () => {
        if (wakeLock !== null && document.visibilityState === "visible") {
          await requestWakeLock();
        }
      });

      // Initial wake lock request
      requestWakeLock();
    </script>
